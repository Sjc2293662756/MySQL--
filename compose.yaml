services:
  traffic:
    image: mysql-traffic-generator:1.0.4
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./logs
        target: /app/logs
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
